name: Security Gates

on:
  push:
    branches: [main, master]

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.14.0

jobs:
  trivy:
    name: Scan container image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build image for scanning
        run: docker build --tag va-automation:security .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: va-automation:security
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  snyk:
    name: Scan dependencies with Snyk
    if: ${{ vars.SNYK_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Snyk configuration
        if: ${{ env.SNYK_TOKEN == '' }}
        run: |
          echo "::error::SNYK_ENABLED is true but SNYK_TOKEN is not configured."
          exit 1

      - name: Run Snyk dependency scan
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/node@v1.0.0
        with:
          args: --severity-threshold=high

      - name: Monitor project with Snyk
        if: ${{ env.SNYK_TOKEN != '' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: snyk/actions/node@v1.0.0
        with:
          command: monitor
