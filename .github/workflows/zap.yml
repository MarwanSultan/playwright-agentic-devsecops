name: Authorized ZAP Baseline

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Authorized local/test URL only (for example http://localhost:3000)'
        required: true
        default: 'http://localhost:3000'
        type: string

permissions:
  contents: read

concurrency:
  group: zap-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  zap:
    name: Run authorized baseline scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate target scope
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          case "$TARGET_URL" in
            http://localhost:[0-9]*|http://127.0.0.1:[0-9]*) ;;
            *)
              echo "::error::Only explicitly authorized localhost or 127.0.0.1 targets with a port are allowed."
              exit 1
              ;;
          esac

      - name: Run OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ inputs.target_url }}
          fail_action: true
          allow_issue_writing: false
