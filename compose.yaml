services:
  tests:
    build:
      context: .
      target: runner
    environment:
      BASE_URL: ${BASE_URL:-https://www.va.gov}
      API_BASE_URL: ${API_BASE_URL:-https://www.va.gov}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      CI: 'true'
      HEADLESS: 'true'
      WORKERS: ${WORKERS:-2}
      RETRIES: ${RETRIES:-1}
    command: ['npm', 'test', '--', '--project=chromium']
